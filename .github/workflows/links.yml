name: links

on:
  push:
    branches: [main]
    paths: ["**/*.md", "lychee.toml", ".github/workflows/links.yml"]
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC — catch link rot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--config lychee.toml --no-progress './**/*.md'"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
